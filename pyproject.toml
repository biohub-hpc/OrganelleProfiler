[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "organelle_profiler"
version = "0.1.0"
description = "Organelle segmentation, geometric feature extraction, and clustering"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Gav Sturm", email = "gav.sturm@czbiohub.org" },
    { name = "Alex Hillsley", email = "alexander.hillsley@czbiohub.org" },
    { name = "Mark Potts", email = "mark.potts@czbiohub.org" },
]
dependencies = [
    "numpy",
    "pandas",
    "zarr",
    "iohub>=0.3.0a7",
    "pyyaml",
    "tqdm",
    "joblib",
    "click",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "anndata",
    "scanpy",
    "tensorstore",
    "tifffile",
    "pyarrow",
    "submitit",
    "dask",
    "statsmodels",
    "copairs",
]

[project.optional-dependencies]
interactive = [
    "plotly",
    "dash",
    "umap-learn",
    "hdbscan",
    "leidenalg",
]
rapids = [
    "cucim-cu12>=25.6",
    "cuml-cu12>=25.6",
    "maayanlab-bioinformatics",
]
all = [
    "organelle_profiler[interactive,rapids]",
]

# Hatch config
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
