        organelle_pattern: "gfp"
        dino_channel: "GFP"
        notes: "GFP ATP1B3"
      - experiment: ops0118_20260129
        organelle_pattern: "gfp"
        dino_channel: "VAMP3"
        notes: "GFP VAMP3"

  f_actin:
    cp_organelle_pattern: "cp1_f_actin"
    cp_dino_channel: "CP1_f_actin_Phalloidin"
    live_cell:
      - experiment: ops0125_20260219
        organelle_pattern: "mcherry"
        dino_channel: "mCherry"
        notes: "mCherry FastAct_SPY555 live cell dye"
      - experiment: ops0076_20250917
        organelle_pattern: "mcherry"
        dino_channel: "mCherry"
        notes: "mCherry FastAct_SPY555 live cell dye"

  nucleoli:
    cp_organelle_pattern: "cp2_nucleoli"
    cp_dino_channel: "CP2_nucleoli_NPM1"
    live_cell:
      - experiment: ops0117_20260128
        organelle_pattern: "gfp"
        dino_channel: "GFP"
        notes: "GFP NPM3"
      - experiment: ops0091_20251117
        organelle_pattern: "gfp"
        dino_channel: "GFP"
        notes: "GFP FBL"
      - experiment: ops0121_20260210
        organelle_pattern: "gfp"
        dino_channel: "FBL"
        notes: "GFP nucleolus-DFC, FBL"

  microtubules:
    cp_organelle_pattern: "cp2_microtub"
    cp_dino_channel: "CP2_microtubules_Tubulin"
    live_cell:
      - experiment: ops0100_20251218
        organelle_pattern: "gfp"
        dino_channel: "GFP"
        notes: "GFP MAP4"

  er:
    cp_organelle_pattern: "cp2_er"
    cp_dino_channel: "CP2_ER_ConA"
