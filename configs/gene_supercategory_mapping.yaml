# Gene Super-Category Mapping for Reporter Radar Plots
#
# Maps genes to 8 high-level cell biology categories via three passes:
#   1. chad_clusters: Named clusters from CHAD v5 hierarchy (highest priority)
#   2. pathway_keywords: Reactome + GO annotation keyword matching
#   3. gene_patterns: Regex fallback on gene name
#
# Categories are assigned in priority order (first match wins).
# Designed for ~1009-gene OPS panel → ~90% coverage, 57-228 genes per category.
#
# Sources:
#   CHAD: /hpc/projects/icd.ops/configs/gene_clusters/chad_positive_controls_v5_hierarchy.yml
#   Gene panel: /hpc/projects/intracellular_dashboard/ops/configs/annotated_gene_panel_July2025.csv

chad_hierarchy_path: /hpc/projects/icd.ops/configs/gene_clusters/chad_positive_controls_v5_hierarchy.yml
gene_panel_path: /hpc/projects/intracellular_dashboard/ops/configs/annotated_gene_panel_July2025.csv

super_categories:
  Translation:
    description: "Ribosome biogenesis, tRNA, translation initiation"
    chad_clusters:
      - translation
      - ribosome
      - "ribosome 40s"
      - "ribosome 60s"
      - "Ribosome 60s Biogenesis"
      - "Ribosome 40s Biogenesis"
      - tRNA
      - "tRNA synthetase"
      - eIF2
    pathway_keywords:
      - translation
      - ribosom
      - "trna synthetase"
      - "aminoacyl-trna"
      - "rrna processing"
      - "rrna modification"
      - "eukaryotic translation"
      - "cap-dependent translation"
      - "structural constituent of ribosome"
      - "srp-dependent cotranslational"
    gene_patterns:
      - "^RPL\\d"
      - "^RPS\\d"
      - "^RPSA"
      - "^MRPL"
      - "^MRPS"
      - "^EIF[2-6]"
      - "^FAU$"
      - "^UBA52$"

  Gene Expression:
    description: "Transcription, splicing, RNA processing, chromatin, mRNA export"
    chad_clusters:
